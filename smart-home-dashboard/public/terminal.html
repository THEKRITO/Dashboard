<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Terminal - Smart Home</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <nav class="nav">
      <div class="brand">Smart Home</div>
      <a href="/">Main</a>
      <a href="/terminal.html" class="active">Terminal</a>
      <a href="/pages.html">Pages</a>
    </nav>
  </header>
  <main>
    <h2>Host Terminal (interactive)</h2>
    <div class="terminal-wrap">
      <div id="terminal" class="term-output" style="height:520px;"></div>
    </div>
  </main>
  <!-- xterm.js and socket.io client -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.js"></script>
  <script>
    const socket = io();
    const { Terminal } = window;
    const { FitAddon } = window;
    const term = new Terminal({cursorBlink: true});
    const fitAddon = new FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    socket.on('output', data => { term.write(data); });

    term.onData(d => { socket.emit('input', d); });

    // notify server about resize
    window.addEventListener('resize', () => {
      fitAddon.fit();
      socket.emit('resize', { cols: term.cols, rows: term.rows });
    });

    // initial resize
    socket.emit('resize', { cols: term.cols, rows: term.rows });
  </script>
</body>
</html>
