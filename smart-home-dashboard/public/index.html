<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smart Home Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <nav class="nav">
      <a href="/" class="brand">Smart Home</a>
      <a href="/terminal.html">Terminal</a>
      <a href="/pages.html">Pages</a>
      <a href="https://github.com/THEKRITO/Dashboard" target="_blank">GitHub</a>
    </nav>
  </header>
  <main>
    <section id="sensors">
      <h2>Live Sensors</h2>
      <div id="sensor-cards">
        <div class="card"><strong>Local Temp (Bucharest)</strong><div id="temp-out">-- °C</div></div>
        <div class="card"><strong>CPU Temp (Raspberry Pi)</strong><div id="temp-cpu">-- °C</div></div>
      </div>
      <canvas id="sensor-chart" width="600" height="200"></canvas>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="/app.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
